<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#0b0f19" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Monogram "CS" -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Inter', monospace" font-weight="800" font-size="38" letter-spacing="-1">
    <text x="22" y="63" fill="#f8fafc">C</text>
    <text x="50" y="63" fill="url(#primaryGrad)">S</text>
  </g>
  
  <!-- Small Terminal Accent Dot -->
  <circle cx="80" cy="61" r="3.5" fill="#06b6d4" />
</svg>
